<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Travel OS — your trip, your data</title>
  <desc id="desc">A travel route flows beside a calm itinerary dashboard with three days of plans.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10241d"/>
      <stop offset="1" stop-color="#274a3d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1c77a"/>
      <stop offset="1" stop-color="#db8c63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#07100c" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="90" cy="70" r="180" fill="#4c7c69" opacity=".14"/>
  <circle cx="1110" cy="560" r="240" fill="#091711" opacity=".28"/>

  <g transform="translate(72 84)">
    <rect width="58" height="58" rx="16" fill="#f4efe2"/>
    <path d="M15 37c10-17 24-21 34-12-10 0-16 6-19 19" fill="none" stroke="#24483a" stroke-width="5" stroke-linecap="round"/>
    <text x="78" y="27" fill="#f7f1e3" font-family="Arial, sans-serif" font-size="28" font-weight="700">Travel OS</text>
    <text x="79" y="49" fill="#b8cfc4" font-family="Arial, sans-serif" font-size="11" letter-spacing="4">YOUR TRIP, YOUR DATA</text>

    <text x="0" y="150" fill="#f7f1e3" font-family="Arial, sans-serif" font-size="58" font-weight="700">
      <tspan x="0" dy="0">把旅程收進一張</tspan>
      <tspan x="0" dy="72">真正屬於你的地圖</tspan>
    </text>
    <text x="0" y="326" fill="#c9d9d1" font-family="Arial, sans-serif" font-size="19">
      <tspan x="0" dy="0">Cloud sync · User-owned data · Open source</tspan>
      <tspan x="0" dy="34">從出發前的想像，到旅途中的每一天。</tspan>
    </text>

    <path d="M10 450 C95 390 150 510 245 438 S390 400 452 462" fill="none" stroke="url(#glow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12"/>
    <circle cx="10" cy="450" r="8" fill="#f1c77a"/>
    <circle cx="245" cy="438" r="8" fill="#f1c77a"/>
    <path d="M443 448l25 14-25 14 6-14z" fill="#f1c77a"/>
  </g>

  <g transform="translate(610 60)" filter="url(#shadow)">
    <rect width="518" height="510" rx="24" fill="#f7f3e9"/>
    <rect width="518" height="58" rx="24" fill="#fffdf7"/>
    <rect y="34" width="518" height="24" fill="#fffdf7"/>
    <circle cx="28" cy="28" r="5" fill="#e48b73"/>
    <circle cx="47" cy="28" r="5" fill="#e4bd73"/>
    <circle cx="66" cy="28" r="5" fill="#6a9b7f"/>
    <rect x="92" y="19" width="220" height="18" rx="9" fill="#e9e5da"/>

    <text x="32" y="98" fill="#876f56" font-family="Arial, sans-serif" font-size="10" letter-spacing="3">2027 · CITY NOTES</text>
    <text x="32" y="132" fill="#183c30" font-family="Arial, sans-serif" font-size="28" font-weight="700">跨年城市散步</text>
    <text x="32" y="158" fill="#6c766f" font-family="Arial, sans-serif" font-size="14">Tallinn · Helsinki</text>

    <g transform="translate(32 185)">
      <rect width="138" height="66" rx="14" fill="#24483a"/>
      <text x="18" y="25" fill="#c6d8cf" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">DAY 1</text>
      <text x="18" y="49" fill="#fffdf7" font-family="Arial, sans-serif" font-size="17" font-weight="700">12/31 · THU</text>
      <rect x="150" width="138" height="66" rx="14" fill="#ece8dc"/>
      <text x="168" y="25" fill="#718078" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">DAY 2</text>
      <text x="168" y="49" fill="#29473c" font-family="Arial, sans-serif" font-size="17" font-weight="700">01/01 · FRI</text>
      <rect x="300" width="138" height="66" rx="14" fill="#ece8dc"/>
      <text x="318" y="25" fill="#718078" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">DAY 3</text>
      <text x="318" y="49" fill="#29473c" font-family="Arial, sans-serif" font-size="17" font-weight="700">01/02 · SAT</text>
    </g>

    <g transform="translate(32 278)">
      <rect width="454" height="92" rx="15" fill="#fffdf7" stroke="#ded8c9"/>
      <text x="20" y="30" fill="#9a7658" font-family="Arial, sans-serif" font-size="12" font-weight="700">09:30</text>
      <circle cx="88" cy="28" r="6" fill="#e0a760"/>
      <text x="108" y="33" fill="#1d3e33" font-family="Arial, sans-serif" font-size="17" font-weight="700">Old Town morning walk</text>
      <text x="108" y="60" fill="#788079" font-family="Arial, sans-serif" font-size="12">Market square · shared route</text>
    </g>
    <g transform="translate(32 382)">
      <rect width="454" height="92" rx="15" fill="#fffdf7" stroke="#ded8c9"/>
      <text x="20" y="30" fill="#9a7658" font-family="Arial, sans-serif" font-size="12" font-weight="700">22:00</text>
      <circle cx="88" cy="28" r="6" fill="#5f8d77"/>
      <text x="108" y="33" fill="#1d3e33" font-family="Arial, sans-serif" font-size="17" font-weight="700">AY101 · TLL → HEL</text>
      <text x="108" y="60" fill="#788079" font-family="Arial, sans-serif" font-size="12">Europe/Tallinn → Europe/Helsinki</text>
    </g>
  </g>
</svg>
